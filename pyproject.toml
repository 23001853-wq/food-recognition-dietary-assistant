[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "food-recognition-dietary-assistant"
version = "0.1.0"
description = "Food classification and portion-aware meal diary (MVP scaffold)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "streamlit>=1.36,<2",
    "SQLAlchemy>=2,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3,<4",
    "pydantic-settings>=2,<3",
    "Pillow>=10,<13",
    "pandas>=2,<3",
    "plotly>=5,<7",
    "PyYAML>=6,<7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2,<3", "torchvision>=0.16,<1", "opencv-python-headless>=4,<5",
    "scikit-learn>=1.3,<2", "scikit-image>=0.22,<1", "numpy>=1.26,<3",
    "matplotlib>=3.8,<4", "tensorboard>=2,<3", "joblib>=1.3,<2",
]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires a separate PostgreSQL test database",
    "smoke: requires implemented application and a trusted model release",
]
